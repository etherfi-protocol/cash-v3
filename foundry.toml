[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.28" 
optimizer = true
optimizer_runs = 0
evm_version = "cancun" 
gas_reports = ["*"]
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./" }]
extra_output = ["storageLayout"]
ffi = true
dynamic_test_linking = true
# The lend tests deploy a real Aave v4 instance (Hub/Spoke from the aave-v4 source) on an Optimism fork,
# and scripts/aave-v4/** deploys one for real. Keep both out of the default profile so the default build
# stays small and free of the aave-v4 dependency; run them under FOUNDRY_PROFILE=lend / aave-deploy (below).
skip = ["test/safe/modules/cash/lend/**", "scripts/aave-v4/**"]

# Profile for the lend (Aave v4) tests: un-skips them and links aave-v4's external LiquidationLogic library.
# SpokeInstance links LiquidationLogic via an aave-rooted `src/` import forge can't resolve to an artifact,
# so pin it to a fixed address; AaveV4Fixture etches the library's runtime code there before deploying.
[profile.lend]
skip = []
libraries = ["src/spoke/libraries/LiquidationLogic.sol:LiquidationLogic:0x0000000000000000000000000000000000000A01"]

# Modest bounds: each handler call drives real Aave ops on the fork, so keep the campaign small.
[profile.lend.invariant]
runs = 12
depth = 10

# Profile for scripts/aave-v4/** (real Aave v4 deployments). Forge can't resolve LiquidationLogic's
# aave-rooted `src/` import to an artifact (same issue as [profile.lend]), so auto-link/auto-deploy fails;
# instead pin it to its deterministic CREATE2 address (Nick's factory, salt keccak256("ether.fi/aave-v4-test/LiquidationLogic"),
# current aave-v4 bytecode) and DeployAaveV4TestInstance deploys the library there idempotently before the
# spoke. The script recomputes this address from the artifact and reverts if the pin is stale.
[profile.aave-deploy]
skip = ["test/safe/modules/cash/lend/**"]
libraries = ["src/spoke/libraries/LiquidationLogic.sol:LiquidationLogic:0x49dEE75906621Ea28D7332bb26E0da6f2d15E838"]
# HubInstance/SpokeInstance exceed EIP-170 (spoke: 25441 bytes runtime) under this repo's default settings
# (optimizer_runs = 0, no via-ir). Compile the whole profile with aave-v4's spoke settings (via-ir, 750 runs)
# so the deployed instances fit the size limit — a per-contract compilation_restrictions split doesn't work
# here because the deploy script `new`s the instances, embedding their creation code in its own unit.
# NB these settings change LiquidationLogic's bytecode, so the pinned CREATE2 address above is specific to
# this profile; the deploy script recomputes it from the artifact and reverts if it drifts.
via_ir = true
optimizer_runs = 750

[fuzz]
runs = 10000

[rpc_endpoints]
mainnet = "${MAINNET_RPC}"
scroll = "${SCROLL_RPC}"
base = "${BASE_RPC}"
optimism = "${OPTIMISM_RPC}"
polygon = "${POLYGON_RPC}"
linea = "${LINEA_RPC}"
sonic = "${SONIC_RPC}"
avalanche = "${AVALANCHE_RPC}"
mantle = "${MANTLE_RPC}"
plasma = "${PLASMA_RPC}"
tempo = "${TEMPO_RPC}"

[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}" }
scroll = { key = "${ETHERSCAN_KEY}" }
base = { key = "${ETHERSCAN_KEY}" }
optimism = { key = "${ETHERSCAN_KEY}" }
hyperevm  = { key = "${ETHERSCAN_KEY}", chain = 999 }
polygon = { key = "${ETHERSCAN_KEY}" }
linea = { key = "${ETHERSCAN_KEY}" }
sonic = { key = "${ETHERSCAN_KEY}" }
avalanche = { key = "${SNOWTRACE_KEY}", chain = 43114, url = "https://api.snowtrace.io/api" }
mantle = { key = "${ETHERSCAN_KEY}" }
plasma = { key = "${ETHERSCAN_KEY}", chain = 9745, url = "https://api.etherscan.io/v2/api?chainid=9745" }
tempo = { key = "${ETHERSCAN_KEY}", chain = 4217, url = "https://api.etherscan.io/v2/api?chainid=4217" }


[fmt]
line_length = 500
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
sort_imports = true

[lint]
lint_on_build = false
