name: Test

on:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  ENV: ${{ secrets.ENV || 'mainnet' }}
  TEST_CHAIN: ${{ secrets.TEST_CHAIN || '10' }}
  TEST_RPC: ${{ secrets.TEST_RPC || 'https://mainnet.optimism.io' }}
  MAINNET_RPC: ${{ secrets.MAINNET_RPC }}
  SCROLL_RPC: ${{ secrets.SCROLL_RPC }}
  BASE_RPC: ${{ secrets.BASE_RPC }}
  ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
  HYPEREVM_RPC: ${{ secrets.HYPEREVM_RPC }}
  OPTIMISM_RPC: ${{ secrets.OPTIMISM_RPC }}
  OPENOCEAN_API_KEY: ${{ secrets.OPENOCEAN_API_KEY }}

jobs:
  check:
    strategy:
      # The deployed-contract checks can be red on their own (they describe the post-upgrade state), so
      # one shard failing must not cancel the others
      fail-fast: false
      matrix:
        include:
          - shard: safe
            profile: ci
            args: --match-path 'test/safe/**'
            size-gate: true
          - shard: rest
            profile: ci
            args: --no-match-path 'test/{safe,deployed-sanity,upgrade-bytecode-verification}/**'
          - shard: deployed
            profile: ci
            args: --match-path 'test/{deployed-sanity,upgrade-bytecode-verification}/**'
          # The lend (Aave v4) tests deploy a real Aave v4 instance on an Optimism fork, so they run under
          # the lend profile against the fork rather than the default profile.
          - shard: lend
            profile: lend
            args: --match-path 'test/safe/modules/cash/lend/**'

    name: Run Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # Forge recompiles only what changed, so the previous run's artifacts make the build incremental
      - name: Restore compile cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: forge-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: forge-${{ matrix.profile }}-

      # Size-gate our own contracts. The lend tests (and aave-v4's SpokeInstance) are skipped by the default
      # profile, so they never reach this size check.
      - name: Run Forge build
        if: matrix.size-gate
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv ${{ matrix.args }}
        env:
          TS_NODE_COMPILER_OPTIONS: '{"module":"commonjs"}'
